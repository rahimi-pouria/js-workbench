<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do list</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="container">
        <div class="row d-flex flex-column g-10">
            <h2 class="heading w-100 text-center ">todo list</h2>
            <div class="d-flex w-100 gap-46">
                <div class="d-flex w-75 flex-column g-5 f-s-20">
                    <label for="addText">add Text</label>
                    <input type="text" id="addText" class=" w-100 add-text">
                </div>
                <div class="d-flex w-20 justify-content-center align-items-center pt-25 cursor-pointer">
                    <button id="btnAddText" class="btn w-100 cursor-pointer">add text</button>
                </div>
            </div>
            <div class="d-flex w-100">
                <div id="element" class="w-100 d-flex flex-column gap-10"></div>
            </div>
        </div>
    </div>


    <script src="./js/index.js"></script>
</body>

</html>
